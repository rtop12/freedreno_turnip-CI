name: Build "turnip"

on:
  workflow_dispatch:
  schedule:
  - cron: "20 5 1,15 * *"

jobs:
  start_building_turnip:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v3

    - name: Prepare environment
      run: |
        sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
        sudo apt update
        sudo apt build-dep mesa -y

    - name: Execute build script
      run: bash ./turnip_builder.sh

    # =========================================================
    # 【新增】上传提取出来的最新纯净版 tu_cmd_buffer.cc
    # =========================================================
    - name: Upload Original tu_cmd_buffer.cc
      uses: actions/upload-artifact@v4
      with:
        name: original_tu_cmd_buffer
        path: turnip_workdir/original_tu_cmd_buffer.zip

    # 上传日志，路径已经修正为 mesa-src（防止找不到报错）
    - name: Upload logs for debugging
      uses: actions/upload-artifact@v4
      with:
        name: meson_ninja_logs
        path: |
          turnip_workdir/ninja_log
          turnip_workdir/mesa-src/build-android-aarch64/meson-logs/meson-log.txt

    # 如果你的代码没问题，这里会生成最终的卡刷包
    - name: Release "turnip"
      uses: softprops/action-gh-release@v1
      with:
        body: Turnip magisk module and driver package for adrenotools
        tag_name: github_run
        name: Weekly Action Release
        files: |
           turnip_workdir/turnip.zip
           turnip_workdir/turnip_adrenotools.zip
